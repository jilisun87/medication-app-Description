<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1890FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="用药管理" />
  <meta name="description" content="青岛市市立医院 患者用药管理 PWA" />
  <title>患者用药管理 · 青岛市市立医院</title>

  <!-- PWA 配置 -->
  <link rel="manifest" href="manifest.json" />
  <!-- OCR 引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- 内嵌 SVG favicon，避免额外请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E" />

  <style>
    /* ============================================================
     * 基础变量与重置
     * ============================================================ */
    :root {
      --primary: #2B7AEE;
      --primary-dark: #1B5BB5;
      --primary-light: #E8F1FF;
      --primary-glow: rgba(43,122,238,0.25);
      --accent: #5B8DEF;
      --success: #34C759;
      --success-light: #E8F9EC;
      --warning: #FF6B6B;
      --warning-light: #FFF1F0;
      --bg: #F2F5FA;
      --bg-soft: #E8ECF4;
      --card-bg: #FFFFFF;
      --text-primary: #1A1D29;
      --text-secondary: #555B6E;
      --text-tertiary: #8C92A5;
      --text-disabled: #BFC4D2;
      --border: #E4E8F0;
      --divider: #EFF2F8;
      --shadow: 0 2px 12px rgba(20,30,60,0.06);
      --shadow-md: 0 4px 20px rgba(20,30,60,0.08);
      --shadow-lg: 0 8px 32px rgba(20,30,60,0.12);
      --shadow-glow: 0 4px 24px var(--primary-glow);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --tab-height: 60px;
      --header-height: 56px;
      --safe-bottom: env(safe-area-inset-bottom, 0);
      --tap-highlight: rgba(43,122,238,0.08);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: var(--tap-highlight);
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      border: none;
      outline: none;
      background: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, h4, h5, h6 {
      margin: 0;
      font-weight: 600;
    }

    p { margin: 0; }

    /* ============================================================
     * 主应用容器
     * ============================================================ */
    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--header-height);
      padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 8px);
      position: relative;
      background: var(--bg);
    }

    /* 顶部页面标题栏 */
    .page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      height: var(--header-height);
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      z-index: 100;
      padding-top: env(safe-area-inset-top, 0);
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
      letter-spacing: -0.3px;
    }

    /* ============================================================
     * 底部 Tab 导航
     * ============================================================ */
    #tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      height: calc(var(--tab-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      display: flex;
      box-shadow: 0 -1px 0 rgba(0,0,0,0.04), 0 -4px 20px rgba(0,0,0,0.04);
      z-index: 100;
      border-radius: 0;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 22px;
      color: var(--text-tertiary);
      transition: color 0.3s var(--ease-out), transform 0.3s var(--spring);
      padding: 6px 0;
      position: relative;
    }

    .tab-item span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .tab-item.active {
      color: var(--primary);
      transform: translateY(-2px);
    }
    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary-glow);
    }

    /* ============================================================
     * 页面通用样式
     * ============================================================ */
    .page {
      padding: 16px;
      animation: fadeIn 0.25s ease;
    }
    .page:first-child {
      padding-top: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: 0 2px 12px rgba(20,30,60,0.05);
      padding: 16px;
      margin-bottom: 12px;
      transition: box-shadow 0.3s var(--ease-out), transform 0.2s var(--ease-out);
      border: 1px solid rgba(228,232,240,0.6);
    }
    .card:active {
      transform: scale(0.985);
      box-shadow: 0 1px 6px rgba(20,30,60,0.08);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ============================================================
     * 首页 - 今日用药
     * ============================================================ */
    .date-bar {
      background: linear-gradient(135deg, #2B7AEE 0%, #1B5BB5 60%, #5B8DEF 100%);
      color: #fff;
      border-radius: var(--radius-xl);
      padding: 24px 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(43,122,238,0.18);
      position: relative;
      overflow: hidden;
    }
    .date-bar::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .date-bar::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }
    .date-bar > * { position: relative; z-index: 1; }
    .date-bar .today-label {
      font-size: 12px;
      opacity: 0.85;
    }
    .date-bar .today-date {
      font-size: 22px;
      font-weight: 600;
      margin-top: 4px;
    }
    .date-bar .today-week {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 4px;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    .stat-item {
      flex: 1;
      background: rgba(255,255,255,0.18);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
    }
    .stat-label {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .med-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .med-info {
      flex: 1;
      min-width: 0;
    }
    .med-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .med-meta {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .med-meta .time-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    .med-meta .dose-tag {
      background: var(--divider);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .checkin-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid var(--border);
      color: var(--text-tertiary);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.4s var(--spring);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .checkin-btn:active { transform: scale(0.88); }

    .checkin-btn.checked {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
      box-shadow: 0 4px 20px rgba(52,199,89,0.35);
      animation: checkinPop 0.5s var(--spring);
    }
    @keyframes checkinPop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .checkin-btn .check-time {
      font-size: 9px;
      font-weight: 500;
      margin-top: 2px;
      line-height: 1;
    }

    /* 添加药品按钮 - 底部固定全宽样式 */
    .add-med-btn {
      position: fixed;
      bottom: calc(var(--tab-height) + var(--safe-bottom) + 8px);
      left: 16px;
      right: 16px;
      max-width: 448px;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      height: 52px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 4px 24px var(--primary-glow);
      z-index: 50;
      transition: all 0.3s var(--spring);
      letter-spacing: 0.3px;
    }
    .add-med-btn:active {
      transform: scale(0.96);
      box-shadow: 0 2px 12px var(--primary-glow);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-tertiary);
    }
    .empty-state .emoji {
      font-size: 56px;
      margin-bottom: 16px;
      filter: grayscale(0.15);
      animation: floatBob 3s ease-in-out infinite;
    }
    @keyframes floatBob {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .empty-state .tip {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }
    .empty-state .sub {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    /* ============================================================
     * 日历页
     * ============================================================ */
    .cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .cal-toolbar .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cal-toolbar .cal-title {
      font-size: 16px;
      font-weight: 600;
    }

    .cal-grid {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .cal-weekday {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 4px 0;
    }
    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    .cal-day:active { background: var(--primary-light); }
    .cal-day.outside { opacity: 0.35; }
    .cal-day.today {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }
    .cal-day.selected {
      background: var(--primary);
      color: #fff;
    }
    .cal-day.selected .day-status { filter: brightness(1.3); }
    .cal-day .day-num { font-size: 14px; line-height: 1; }
    .cal-day .day-status {
      font-size: 12px;
      margin-top: 2px;
      line-height: 1;
    }

    .day-detail {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .day-detail-title {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .med-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--divider);
    }
    .med-mini:last-child { border-bottom: none; }
    .med-mini .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .med-mini .dot.done { background: var(--success); }
    .med-mini .dot.partial { background: #FAAD14; }
    .med-mini .dot.missed { background: var(--text-disabled); }
    .med-mini .info { flex: 1; min-width: 0; }
    .med-mini .name { font-size: 14px; }
    .med-mini .time-info { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .med-mini .check-mark { font-size: 18px; }

    /* ============================================================
     * 不良反应上报页
     * ============================================================ */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .symptom-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .symptom-chip {
      padding: 10px 8px;
      border-radius: var(--radius);
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 14px;
      border: 1.5px solid var(--border);
      transition: all 0.15s;
      text-align: center;
    }
    .symptom-chip.active {
      background: var(--warning-light);
      color: var(--warning);
      border-color: var(--warning);
      font-weight: 600;
    }

    .severity-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .severity-item {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      border: 1px solid var(--border);
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .severity-item.active {
      background: var(--warning-light);
      color: var(--warning);
      border-color: var(--warning);
      font-weight: 600;
    }

    .textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 14px;
      resize: vertical;
    }

    .upload-box {
      width: 100%;
      padding: 24px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
      margin-bottom: 16px;
      background: var(--card-bg);
    }
    .upload-box.has-photo {
      padding: 0;
      border-style: solid;
      overflow: hidden;
    }
    .upload-box img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      display: block;
    }
    .upload-box .remove-photo {
      display: block;
      width: 100%;
      padding: 6px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 12px;
    }

    .primary-btn {
      width: 100%;
      height: 50px;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(24,144,255,0.35);
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .primary-btn:active { opacity: 0.88; }
    .primary-btn:disabled {
      background: var(--text-disabled);
      box-shadow: none;
      cursor: not-allowed;
    }

    .danger-btn {
      background: var(--warning);
      box-shadow: 0 4px 12px rgba(255,107,107,0.3);
    }

    .report-record {
      padding: 12px;
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border-left: 3px solid var(--warning);
    }
    .report-record .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .report-record .date { font-size: 12px; color: var(--text-tertiary); }
    .report-record .severity-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--warning-light);
      color: var(--warning);
    }
    .report-record .symptoms {
      font-size: 13px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .report-record .desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ============================================================
     * 我的页
     * ============================================================ */
    .pharmacist-card {
      background: linear-gradient(135deg, #2B7AEE 0%, #1B5BB5 60%, #5B8DEF 100%);
      color: #fff;
      border-radius: var(--radius-xl);
      padding: 24px 20px;
      box-shadow: 0 8px 32px rgba(43,122,238,0.18);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .pharmacist-card::before {
      content: '';
      position: absolute;
      top: -20px;
      right: -20px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }
    .pharmacist-card > * { position: relative; z-index: 1; }
    .pharmacist-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .pharmacist-info { flex: 1; min-width: 0; }
    .pharmacist-info .name {
      font-size: 18px;
      font-weight: 600;
    }
    .pharmacist-info .dept {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 2px;
    }
    .pharmacist-info .hospital {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .contact-btn {
      width: 100%;
      height: 48px;
      background: rgba(255,255,255,0.95);
      color: var(--primary);
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .menu-list {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--divider);
      transition: background 0.15s;
    }
    .menu-item:active { background: var(--bg); }
    .menu-item:last-child { border-bottom: none; }
    .menu-item .ico { font-size: 20px; width: 24px; text-align: center; }

    /* Switch 开关 */
    .switch {

      width: 44px;
      height: 24px;

      border-radius: 12px;
      transition: background 0.2s;
      cursor: pointer;

    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;

      border-radius: 50%;

    /* 大屏适配（手机横屏或小平板） */

    .chat-input-bar {

<body>
  <!-- 应用容器 -->
  <div id="app">
    <!-- 各页面将由 JS 动态渲染到 #page-root -->
    <div id="page-root"></div>
  </div>

  <!-- 顶部页面标题 -->
  <div class="page-header" id="page-header">今日用药</div>

  <!-- 底部 Tab 导航 -->
  <nav id="tab-bar">
    <a href="#/home"      data-route="home"     class="tab-item active"><span>🏠</span><span>首页</span></a>
    <a href="#/calendar"  data-route="calendar" class="tab-item"><span>📅</span><span>日历</span></a>
    <a href="#/report"    data-route="report"   class="tab-item"><span>⚠️</span><span>上报</span></a>
    <a href="#/profile"   data-route="profile"  class="tab-item"><span>👤</span><span>我的</span></a>
    <a href="#/chat"      data-route="chat"     class="tab-item"><span>💬</span><span>联系药师</span></a>
  </nav>

  <!-- 全局 Toast -->
  <div id="toast"></div>

  <!-- 模态框挂载点 -->
  <div id="modal-root"></div>

  <script>
    /* ============================================================
     * 患者用药管理 PWA - 主逻辑
     * 开发方：青岛市市立医院 临床药学科
     * 临床药师：孙药师
     * ============================================================ */

    'use strict';

    /* ----------------------------------------------------------
     * 1. 常量定义
     * ---------------------------------------------------------- */
    const STORAGE_KEYS = {
      MEDICATIONS: 'pma_medications',
      REPORTS:     'pma_reports',
      SETTINGS:    'pma_settings',
      REMIND_LOG:  'pma_remind_log',  // 记录某天是否已提醒过
      PATIENT:     'pma_patient',      // 患者信息
      MESSAGES:    'pma_messages'      // 联系药师消息
    };

    const PHARMACIST = {
      name: '孙药师',
      dept: '临床药学科',
      hospital: '青岛市市立医院',
      phone: '0532-82789206'
    };

    /* ----------------------------------------------------------
     * 1b. API 配置
     * ---------------------------------------------------------- */
    const API_BASE = '';  // 走 Nginx 反向代理，同源请求

    /**
     * 通用 Fetch 封装，自动携带 Token，处理 401
     * @param {string} path  API 路径（不含 API_BASE）
     * @param {object} options fetch 选项
     * @returns {Promise<any>}  返回 data 字段或整个 JSON
     */
    async function apiFetch(path, options = {}) {
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem('pma_token');
      if (token) headers['Authorization'] = 'Bearer ' + token;
      try {
        const res = await fetch(API_BASE + path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
        const text = await res.text();
        let json;
        try { json = JSON.parse(text); } catch { json = { detail: text.slice(0, 200) }; }
        if (!res.ok) {
          if (res.status === 401) {
            localStorage.removeItem('pma_token');
            localStorage.removeItem('pma_patient_id');
            toast('登录已过期，请重新登录');
            setTimeout(() => { Storage.clearAll(); location.reload(); }, 1500);
          }
          const detail = json.detail || json.message || ('HTTP ' + res.status);
          // 422 字段验证错误不弹 toast（doSendMessage 有自己的 catch）
          if (res.status !== 422 && !options._silent) {
            toast(detail);
          }
          throw new Error(detail);
        }
        return json.data !== undefined ? json.data : json;
      } catch (err) {
        if (err.message && !err.message.includes('Failed to fetch') && !options._silent) {
          // 非网络断连错误已在上面 toast 了，不重复弹
        }
        throw err;
      }
    }

    /** 轮询消息定时器 ID */
    let _msgPollTimer = null;

    // 严重程度标签颜色（用于记录展示）
    const SEVERITY_MAP = {
      '轻度': { bg: '#FFF7E6', color: '#FA8C16' },
      '中度': { bg: '#FFF1F0', color: '#FF6B6B' },
      '重度': { bg: '#FF4D4F', color: '#fff' }
    };

    const WEEKDAY_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const WEEKDAY_SHORT = ['日', '一', '二', '三', '四', '五', '六'];

    /* ----------------------------------------------------------
     * 2. 工具函数
     * ---------------------------------------------------------- */

    /** 生成唯一 ID（时间戳+随机数） */
    function genId(prefix = '') {
      return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    /** 格式化日期 YYYY-MM-DD（本地时区） */
    function fmtDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /** 格式化时间 HH:MM */
    function fmtTime(d) {
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    /** 格式化时间戳（用于显示打卡时间） */
    function fmtDateTime(d) {
      return `${fmtDate(d)} ${fmtTime(d)}:${String(d.getSeconds()).padStart(2,'0')}`;
    }

    /** 取日期对应的星期（0-6，0=周日） */
    function dayOfWeek(dateStr) {
      return new Date(dateStr + 'T00:00:00').getDay();
    }

    /** 转义 HTML，避免 XSS */
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /** Toast 提示 */
    let toastTimer = null;
    function toast(msg, duration = 1800) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    /* ----------------------------------------------------------
     * 3. 数据层（localStorage CRUD）
     * ---------------------------------------------------------- */
    const Storage = {
      _read(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          console.warn('读取数据失败:', key, e);
          return fallback;
        }
      },
      _write(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
          return true;
        } catch (e) {
          console.error('写入数据失败:', key, e);
          toast('存储空间不足，请清理照片或数据');
          return false;
        }
      },

      // ---- 药品 ----
      getMedications() {
        return this._read(STORAGE_KEYS.MEDICATIONS, []);
      },
      saveMedications(list) {
        return this._write(STORAGE_KEYS.MEDICATIONS, list);
      },
      addMedication(med) {
        const list = this.getMedications();
        list.push(med);
        return this.saveMedications(list);
      },
      updateMedication(med) {
        const list = this.getMedications();
        const idx = list.findIndex(m => m.id === med.id);
        if (idx >= 0) {
          list[idx] = med;
          return this.saveMedications(list);
        }
        return false;
      },
      deleteMedication(id) {
        const list = this.getMedications().filter(m => m.id !== id);
        return this.saveMedications(list);
      },

      /** 给某个药品在某天添加打卡记录（每天每个药品只记一次） */
      addCheckinLog(medId, dateStr, checkTime) {
        const list = this.getMedications();
        const med = list.find(m => m.id === medId);
        if (!med) return false;
        med.logs = med.logs || [];
        // 同一天重复打卡只保留最新时间
        const existing = med.logs.find(l => l.date === dateStr);
        if (existing) {
          existing.checkTime = checkTime;
        } else {
          med.logs.push({ date: dateStr, checkTime });
        }
        return this.saveMedications(list);
      },
      removeCheckinLog(medId, dateStr) {
        const list = this.getMedications();
        const med = list.find(m => m.id === medId);
        if (!med) return false;
        med.logs = (med.logs || []).filter(l => l.date !== dateStr);
        return this.saveMedications(list);
      },

      // ---- 不良反应上报 ----
      getReports() {
        return this._read(STORAGE_KEYS.REPORTS, []);
      },
      addReport(report) {
        const list = this.getReports();
        list.unshift(report); // 新的在前
        return this._write(STORAGE_KEYS.REPORTS, list);
      },

      // ---- 设置 ----
      getSettings() {
        return this._read(STORAGE_KEYS.SETTINGS, {
          reminderEnabled: false,
          reminderTime: '09:00'
        });
      },
      saveSettings(settings) {
        return this._write(STORAGE_KEYS.SETTINGS, settings);
      },

      // ---- 提醒日志（避免同一天重复提醒） ----
      getRemindLog() {
        return this._read(STORAGE_KEYS.REMIND_LOG, {});
      },
      markReminded(dateStr) {
        const log = this.getRemindLog();
        log[dateStr] = true;
        return this._write(STORAGE_KEYS.REMIND_LOG, log);
      },
      hasReminded(dateStr) {
        return !!this.getRemindLog()[dateStr];
      },

      // ---- 患者信息 ----
      getPatient() {
        return this._read(STORAGE_KEYS.PATIENT, null);
      },
      savePatient(data) {
        return this._write(STORAGE_KEYS.PATIENT, data);
      },

      // ---- 联系药师消息 ----
      getMessages() {
        return this._read(STORAGE_KEYS.MESSAGES, { conversations: [] });
      },
      saveMessages(data) {
        return this._write(STORAGE_KEYS.MESSAGES, data);
      },
      /** 获取或创建一个患者-药师对话 */
      getOrCreateConversation(patientId, patientName) {
        const data = this.getMessages();
        let conv = data.conversations.find(c => c.patientId === patientId);
        if (!conv) {
          conv = {
            id: 'conv_' + Date.now(),
            patientName,
            patientId,
            lastMessage: '您好，有什么可以帮您？',
            lastTime: fmtDateTime(new Date()),
            unread: 0,
            messages: []
          };
          data.conversations.unshift(conv);
          this.saveMessages(data);
        }
        return conv;
      },
      /** 发送患者消息，更新对话摘要 */
      addPatientMessage(convId, content, photo = null, audio = null, duration = null) {
        const data = this.getMessages();
        const conv = data.conversations.find(c => c.id === convId);
        if (!conv) return;
        const now = new Date();
        const timeStr = now.toTimeString().slice(0, 5);
        conv.messages.push({
          id: 'm_' + Date.now(),
          from: 'patient',
          content: content || null,
          time: timeStr,
          photo: photo || null,
          audio: audio || null,
          duration: duration != null ? duration : null
        });
        conv.lastMessage = audio ? '[语音消息]' : (content && content.length > 30 ? content.slice(0, 30) + '…' : (content || ''));
        conv.lastTime = fmtDateTime(now);
        this.saveMessages(data);
        return conv;
      },
      /** 添加药师回复（模拟或真实） */
      addPharmacistMessage(convId, content, photo = null, audio = null, duration = null) {
        const data = this.getMessages();
        const conv = data.conversations.find(c => c.id === convId);
        if (!conv) return;
        const now = new Date();
        const timeStr = now.toTimeString().slice(0, 5);
        conv.messages.push({
          id: 'm_' + Date.now(),
          from: 'pharmacist',
          content: content || null,
          time: timeStr,
          photo: photo || null,
          audio: audio || null,
          duration: duration != null ? duration : null
        });
        conv.lastMessage = audio ? '[语音消息]' : (content && content.length > 30 ? content.slice(0, 30) + '…' : (content || ''));
        conv.lastTime = fmtDateTime(now);
        conv.unread = (conv.unread || 0) + 1;
        this.saveMessages(data);
        return conv;
      },
      /** 标记对话已读 */
      markConversationRead(convId) {
        const data = this.getMessages();
        const conv = data.conversations.find(c => c.id === convId);
        if (conv) { conv.unread = 0; this.saveMessages(data); }
      },

      // ---- 导出全部数据 ----
      exportAll() {
        return {
          version: '1.0',
          exportTime: fmtDateTime(new Date()),
          patient: this.getPatient(),
          medications: this.getMedications(),
          reports: this.getReports(),
          settings: this.getSettings()
        };
      },

      // ---- 清除全部数据 ----
      clearAll() {
        Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
      }
    };

    /* ----------------------------------------------------------
     * 4. 路由（hash）
     * ---------------------------------------------------------- */
    const Router = {
      current: 'home',
      routes: {
        home:     { title: '今日用药',     render: renderHome },
        calendar: { title: '用药日历',     render: renderCalendar },
        report:   { title: '不良反应上报', render: renderReport },
        profile:  { title: '我的',         render: renderProfile },
        chat:     { title: '联系药师',     render: renderChat }
      },

      /** 根据 hash 解析路由名 */
      parse() {
        const h = location.hash || '#/home';
        const name = h.replace('#/', '').split('/')[0];
        // 支持 #/chat/conv_xxx 格式，提取子路由参数
        const parts = h.replace('#/', '').split('/');
        this._subRoute = parts[1] || null; // e.g. 'conv_xxx'
        return this.routes[name] ? name : 'home';
      },

      /** 渲染当前路由 */
      render() {
        const name = this.parse();
        this.current = name;
        // 更新标题
        document.getElementById('page-header').textContent = this.routes[name].title;
        // 更新 tab 高亮
        document.querySelectorAll('.tab-item').forEach(el => {
          el.classList.toggle('active', el.dataset.route === name);
        });
        // 渲染页面
        const root = document.getElementById('page-root');
        root.innerHTML = '';
        this.routes[name].render(root);
      },

      init() {
        window.addEventListener('hashchange', () => this.render());
        if (!location.hash) location.hash = '#/home';
        this.render();
      }
    };

    /* ----------------------------------------------------------
     * 5. 模态框系统
     * ---------------------------------------------------------- */
    const Modal = {
      /** 打开一个底部弹出模态框，content 为 HTML 字符串 */
      open(title, contentHtml, onMount, options = {}) {
        const { showClose = true, maskClose = true } = options;
        const closeBtnHtml = showClose ? '<button class="close" id="modal-close">✕</button>' : '';
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div class="modal-mask" id="modal-mask">
            <div class="modal-sheet" id="modal-sheet">
              <div class="modal-header">
                <div class="title">${esc(title)}</div>
                ${closeBtnHtml}
              </div>
              <div class="modal-body">${contentHtml}</div>
            </div>
          </div>
        `;
        // 关闭事件
        const close = () => Modal.close();
        if (showClose) document.getElementById('modal-close').addEventListener('click', close);
        if (maskClose) {
          document.getElementById('modal-mask').addEventListener('click', e => {
            if (e.target.id === 'modal-mask') close();
          });
        }
        if (typeof onMount === 'function') onMount();
      },
      close() {
        document.getElementById('modal-root').innerHTML = '';
      }
    };

    /* ----------------------------------------------------------
     * 6. 页面：首页（今日用药）
     * ---------------------------------------------------------- */
    function renderHome(root) {
      const now = new Date();
      const todayStr = fmtDate(now);
      const week = WEEKDAY_NAMES[now.getDay()];

      // 今日需要服用的药品：根据 schedule 过滤
      const meds = Storage.getMedications();
      const todayMeds = meds
        .filter(m => (m.schedule || [0,1,2,3,4,5,6]).includes(now.getDay()))
        .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      // 统计今日打卡进度
      const doneCount = todayMeds.filter(m =>
        (m.logs || []).some(l => l.date === todayStr)
      ).length;

      const html = `
        <div class="page">
          <div class="date-bar">
            <div class="today-label">TODAY</div>
            <div class="today-date">${todayStr}</div>
            <div class="today-week">${week} · 您的服药计划</div>
            <div class="stats-row">
              <div class="stat-item">
                <div class="stat-num">${doneCount}/${todayMeds.length}</div>
                <div class="stat-label">今日打卡</div>
              </div>
              <div class="stat-item">
                <div class="stat-num">${meds.length}</div>
                <div class="stat-label">药品总数</div>
              </div>
            </div>
          </div>

          ${todayMeds.length === 0 ? renderMedEmpty(meds.length) : ''}

          <div id="med-list">
            ${todayMeds.map(med => renderMedCard(med, todayStr)).join('')}
          </div>
        </div>

        ${meds.length === 0 ? '' : `
          <button class="add-med-btn" id="fab-add">＋ 添加药品</button>
        `}
      `;

      root.innerHTML = html;

      // 绑定打卡按钮事件
      root.querySelectorAll('.checkin-btn').forEach(btn => {
        btn.addEventListener('click', () => handleCheckin(btn.dataset.medId, todayStr));
      });

      // 添加按钮
      const fab = document.getElementById('fab-add');
      if (fab) fab.addEventListener('click', openAddMedModal);
    }

    /** 渲染单个药品卡片 */
    function renderMedCard(med, dateStr) {
      const log = (med.logs || []).find(l => l.date === dateStr);
      const checked = !!log;
      const checkTimeShort = log
        ? log.checkTime.split(' ')[1]?.slice(0, 5)
        : '';

      return `
        <div class="card">
          <div class="med-card">
            <div class="med-info">
              <div class="med-name">${esc(med.name)}</div>
              <div class="med-meta">
                <span class="time-tag">⏰ ${esc(med.time || '--:--')}</span>
                <span class="dose-tag">💊 ${esc(med.dosage || '')}</span>
              </div>
            </div>
            <button class="checkin-btn ${checked ? 'checked' : ''}"
                    data-med-id="${esc(med.id)}"
                    aria-label="${checked ? '已打卡' : '点击打卡'}">
              ${checked
                ? `✓<div class="check-time">${esc(checkTimeShort)}</div>`
                : checked ? '' : '○'}
              ${checked ? '' : '<span style="font-size:11px;margin-top:2px;">打卡</span>'}
            </button>
          </div>
        </div>
      `;
    }

    /** 空状态：无药品 */
    function renderMedEmpty(totalCount) {
      if (totalCount === 0) {
        return `
          <div class="empty-state">
            <div class="emoji">💊</div>
            <div class="tip">还没有添加药品</div>
            <div class="sub">点击下方按钮添加您的第一个药品</div>
            <button class="btn-primary" style="margin-top:16px;width:100%;" onclick="openAddMedModal()">＋ 添加药品</button>
          </div>
        `;
      }
      return `
        <div class="empty-state">
          <div class="emoji">🎉</div>
          <div class="tip">今天没有需要服用的药品</div>
          <div class="sub">享受健康的一天</div>
        </div>
      `;
    }

    /** 处理打卡 */
    async function handleCheckin(medId, dateStr) {
      const meds = Storage.getMedications();
      const med = meds.find(m => m.id === medId);
      if (!med) return;
      const checked = (med.logs || []).some(l => l.date === dateStr);

      if (checked) {
        // 取消打卡（再次点击）
        if (confirm(`确定要撤销【${med.name}】今天的打卡记录吗？`)) {
          Storage.removeCheckinLog(medId, dateStr);
          toast('已撤销打卡');
          Router.render();
        }
      } else {
        const now = new Date();
        const checkTime = fmtDateTime(now);
        try {
          await apiFetch(`/api/medications/${medId}/checkin`, { method: 'POST' });
        } catch (e) { /* 网络失败不影响本地 */ }
        Storage.addCheckinLog(medId, dateStr, checkTime);
        toast(`✓ ${med.name} 已打卡`);
        Router.render();
      }
    }

    /* ----------------------------------------------------------
     * 7b. 拍照 OCR 识别药品信息
     * ---------------------------------------------------------- */
    async function scanMedicationImage(file) {
      const preview = document.getElementById('scan-preview');
      const img     = document.getElementById('scan-img');
      const status  = document.getElementById('scan-status');
      const nameInput  = document.getElementById('med-name');
      const dosageInput = document.getElementById('med-dosage');

      // 显示预览
      img.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      status.textContent = '🔄 正在识别药盒文字，请稍候…';

      try {
        // Tesseract OCR（中文+英文）
        const result = await Tesseract.recognize(file, 'eng+chi_sim', {
          logger: m => {
            if (m.status === 'recognizing text') {
              status.textContent = `🔄 识别中… ${Math.round(m.progress * 100)}%`;
            }
          }
        });
        const text = result.data.text.trim();
        console.log('OCR原始识别结果：', text);
        status.textContent = '✅ 识别完成，正在解析…';

        if (!text) {
          status.textContent = '⚠️ 未识别到文字，请手动输入';
          return;
        }

        // 从识别文字中提取结构化信息
        const parsed = parseMedicationText(text);
        if (parsed.name) nameInput.value = parsed.name;
        if (parsed.dosage) dosageInput.value = parsed.dosage;

        const filled = Object.values(parsed).filter(Boolean).join(' | ');
        status.textContent = `✅ 完成${filled ? '，已填入：' + filled : ''}`;

      } catch (err) {
        console.error(err);
        status.textContent = '❌ 识别失败：' + err.message;
      }
    }

    /**
     * 从 OCR 识别的文字中提取药品结构化信息
     * 思路：找药名、剂量规格、用法用量三个区块
     */
    function parseMedicationText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      const result = { name: '', dosage: '' };

      // 常见剂量/规格关键词
      const dosage_kw = ['mg', 'ml', 'μg', 'g', '片', '粒', '颗', '支', '瓶',
                         '剂量', '规格', '用法', '口服', '每次', '一天', '每日',
                         '早餐', '午餐', '晚餐', '睡前', '顿服'];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        // 找药名（第一个不含剂量关键词的较长行）
        if (!result.name && line.length >= 2 && line.length <= 30) {
          const hasKw = dosage_kw.some(k => line.includes(k));
          if (!hasKw) {
            // 过滤掉明显不是药名的短句
            const skip = ['生产', '厂家', '批号', '有效期', '国药准字',
                          '注意事项', '禁忌', '贮藏', '包装', '电话', '地址',
                          '请在', '本品为', '商品', '专利', '发明'];
            if (!skip.some(s => line.includes(s))) {
              result.name = line.replace(/[|\\]/g, '').trim();
            }
          }
        }

        // 找剂量规格（带单位的行）
        if (!result.dosage) {
          const doseMatch = line.match(
            /(\d+(?:\.\d+)?)\s*(mg|ml|μg|g|微克|毫克|克|片|粒|颗|支)\b/i
          );
          if (doseMatch) {
            result.dosage = doseMatch[0];
            // 追加上下文的用法信息
            if (i + 1 < lines.length && (lines[i+1].includes('口服') || lines[i+1].includes('每日') || lines[i+1].includes('每次'))) {
              result.dosage += ' ' + lines[i+1];
            }
          }
        }
      }

      // 兜底：整段提取
      if (!result.name) {
        const allText = lines.join('\n');
        const match = allText.match(/([\u4e00-\u9fa5]{2,15})(?:片|胶囊|缓释片|控释片|注射液|口服液)/);
        if (match) result.name = match[0];
      }

      return result;
    }

    /** 渲染日历格子 + 详情 */
    function renderCalDays(year, month, selectedDate) {
      // 更新标题
      const toolbarTitle = document.querySelector('.cal-toolbar .cal-title');
      if (toolbarTitle) toolbarTitle.textContent = `${year}年${month + 1}月`;

      const todayStr = fmtDate(new Date());
      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay();      // 0-6
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const meds = Storage.getMedications();

      // 计算每天的打卡状态
      const dayStatusCache = {};
      function getDayStatus(dateStr) {
        if (dayStatusCache[dateStr]) return dayStatusCache[dateStr];
        const dow = dayOfWeek(dateStr);
        const scheduled = meds.filter(m => (m.schedule || [0,1,2,3,4,5,6]).includes(dow));
        if (scheduled.length === 0) {
          dayStatusCache[dateStr] = { icon: '', total: 0, done: 0 };
          return dayStatusCache[dateStr];
        }
        const done = scheduled.filter(m => (m.logs || []).some(l => l.date === dateStr)).length;
        let icon = '';
        if (done === scheduled.length) icon = '🌿';
        else if (done > 0)            icon = '🟡';
        else                          icon = '⚪';
        dayStatusCache[dateStr] = { icon, total: scheduled.length, done };
        return dayStatusCache[dateStr];
      }

      // 构建单元格：上个月尾部 + 本月 + 下个月头部
      const cells = [];
      // 上个月尾部
      for (let i = startWeekday - 1; i >= 0; i--) {
        const d = daysInPrevMonth - i;
        const prevMonth = month === 0 ? 11 : month - 1;
        const prevYear  = month === 0 ? year - 1 : year;
        const dateStr = `${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells.push({ dateStr, day: d, outside: true });
      }
      // 本月
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells.push({ dateStr, day: d, outside: false });
      }
      // 下个月头部（补齐到 42 格 = 6 行）
      const remaining = 42 - cells.length;
      for (let d = 1; d <= remaining; d++) {
        const nextMonth = month === 11 ? 0 : month + 1;
        const nextYear  = month === 11 ? year + 1 : year;
        const dateStr = `${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        cells.push({ dateStr, day: d, outside: true });
      }

      const daysEl = document.getElementById('cal-days');
      daysEl.innerHTML = cells.map(c => {
        const status = getDayStatus(c.dateStr);
        const isToday = c.dateStr === todayStr;
        const isSelected = c.dateStr === selectedDate;
        const classes = ['cal-day'];
        if (c.outside) classes.push('outside');
        if (isToday) classes.push('today');
        if (isSelected) classes.push('selected');
        return `
          <div class="${classes.join(' ')}" data-date="${c.dateStr}">
            <div class="day-num">${c.day}</div>
            <div class="day-status">${status.icon}</div>
          </div>
        `;
      }).join('');

      // 绑定点击
      daysEl.querySelectorAll('.cal-day').forEach(el => {
        el.addEventListener('click', () => {
          calendarState.selectedDate = el.dataset.date;
          renderCalDays(year, month, el.dataset.date);
        });
      });

      // 渲染选中日期的详情
      renderDayDetail(selectedDate, getDayStatus);
    }

    /** 渲染选中日期详情 */
    function renderDayDetail(dateStr, getDayStatus) {
      const dow = dayOfWeek(dateStr);
      const meds = Storage.getMedications();
      const scheduled = meds.filter(m => (m.schedule || [0,1,2,3,4,5,6]).includes(dow));

      const el = document.getElementById('day-detail');
      if (!el) return;

      if (scheduled.length === 0) {
        el.innerHTML = `
          <div class="day-detail-title">
            <span>${dateStr} · ${WEEKDAY_NAMES[dow]}</span>
          </div>
          <div class="empty-state" style="padding:24px 0;">
            <div class="emoji">📭</div>
            <div class="tip">当天没有服药计划</div>
          </div>
        `;
        return;
      }

      const rows = scheduled.map(med => {
        const log = (med.logs || []).find(l => l.date === dateStr);
        const checkTime = log ? log.checkTime.split(' ')[1]?.slice(0, 5) : '';
        let dotClass = 'missed';
        let statusText = '未打卡';
        let mark = '○';
        if (log) {
          dotClass = 'done';
          statusText = `已打卡 ${checkTime}`;
          mark = '✓';
        }
        return `
          <div class="med-mini">
            <div class="dot ${dotClass}"></div>
            <div class="info">
              <div class="name">${esc(med.name)} · ${esc(med.dosage)}</div>
              <div class="time-info">⏰ ${esc(med.time)} · ${statusText}</div>
            </div>
            <div class="check-mark">${mark}</div>
          </div>
        `;
      }).join('');

      el.innerHTML = `
        <div class="day-detail-title">
          <span>${dateStr} · ${WEEKDAY_NAMES[dow]}</span>
          <span style="color:var(--text-tertiary);font-size:12px;">
            ${getDayStatus(dateStr).done}/${getDayStatus(dateStr).total} 已完成
          </span>
        </div>
        ${rows}
      `;
    }

        document.getElementById('report-desc').value = '';
        document.querySelectorAll('.symptom-chip').forEach(c => c.classList.remove('active'));

        resetUploadBox();
        Router.render();

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `用药管理数据_${fmtDate(new Date())}.json`;

    /* ----------------------------------------------------------
     * 11. 复诊提醒（每分钟检查一次）
     * ---------------------------------------------------------- */
    function startReminderLoop() {
      // 请求通知权限（首次开启时）
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().catch(() => {});
      }

      // 每 30 秒检查一次
      setInterval(() => {
        const settings = Storage.getSettings();
        if (!settings.reminderEnabled) return;

        const now = new Date();
        const todayStr = fmtDate(now);
        const currentHM = fmtTime(now);
        if (currentHM !== settings.reminderTime) return;

        // 同一天只提醒一次
        if (Storage.hasReminded(todayStr)) return;

        Storage.markReminded(todayStr);

        // 统计今日完成度
        const dow = now.getDay();
        const meds = Storage.getMedications();
        const todayMeds = meds.filter(m => (m.schedule || [0,1,2,3,4,5,6]).includes(dow));
        const done = todayMeds.filter(m => (m.logs || []).some(l => l.date === todayStr)).length;

        const body = todayMeds.length === 0
          ? '今天没有服药计划'
          : `今日已完成 ${done}/${todayMeds.length}，记得按时服药哦`;

        // 系统通知（需要权限）
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification('💊 用药提醒', { body, icon: '/icon-192.png' });
          } catch (e) { /* iOS Safari 不支持 new Notification */ }
        }

        // 应用内弹窗（兜底）
        if (Router.current === 'home') {
          toast(`⏰ ${body}`, 4000);
        } else {
          Modal.open('💊 用药提醒', `
            <div style="padding:12px 0;font-size:14px;color:var(--text-secondary);line-height:1.8;">
              ${esc(body)}
            </div>
            <div class="modal-actions">
              <button class="btn btn-primary" id="btn-remind-ok">我知道了</button>
            </div>
          `, () => {
            document.getElementById('btn-remind-ok').addEventListener('click', () => {
              Modal.close();
              location.hash = '#/home';
            });
          });
        }
      }, 30 * 1000);
    }

    /** 收集某一步的数据 */
    function collectOnboardStepData(step) {
      if (step === 0) {
        return {
          name: document.getElementById('o-name').value.trim(),
          sex: document.querySelector('input[name="o-sex"]:checked')?.value || '',
          age: document.getElementById('o-age').value.trim(),
          phone: document.getElementById('o-phone').value.trim()
        };
      }
      if (step === 1) {
        const rows = document.querySelectorAll('#disease-list .disease-row');
        const diseases = Array.from(rows).map(r => ({
          name: r.querySelector('.d-name').value.trim(),
          years: r.querySelector('.d-years').value.trim()
        })).filter(d => d.name);
        return { diseases };
      }
      if (step === 2) {
        const rows = document.querySelectorAll('#medhist-list .medhist-row');
        const medHistory = Array.from(rows).map(r => ({
          name: r.querySelector('.mh-name').value.trim(),
          dosage: r.querySelector('.mh-dosage').value.trim(),
          reason: r.querySelector('.mh-reason').value.trim()
        })).filter(m => m.name);
        return { medHistory };
      }
      if (step === 3) {
        const items = Array.from(document.querySelectorAll('#allergy-list .allergy-item'))
          .map(i => i.value.trim()).filter(Boolean);
        return { allergies: items };
      }
      if (step === 4) {
        return {
          edu: document.getElementById('o-edu').value,
          height: document.getElementById('o-height').value.trim(),
          weight: document.getElementById('o-weight').value.trim()
        };
      }
    }

    /** 显示向导第几步 */
    function showOnboardStep(step) {
      const existing = Storage.getPatient() || {};
      const savedData = { ...existing };
      const stepTitles = ['基本信息', '既往病史', '用药史', '过敏史', '体格信息'];
      const stepCount = stepTitles.length;

      const html = `
        <div style="padding:0 0 8px 0;">
          <div style="display:flex;gap:4px;margin-bottom:16px;">
            ${stepTitles.map((t, i) => `
              <div style="flex:1;height:3px;border-radius:2px;background:${i<=step?'var(--primary)':'var(--border)'}"></div>
            `).join('')}
          </div>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">
            步骤 ${step + 1}/${stepCount}：${stepTitles[step]}
          </div>
          <div id="onboard-fields">${getOnboardStepContent(step, savedData)}</div>
        </div>
        <div class="modal-actions">
          ${step > 0 ? '<button class="btn btn-secondary" id="o-btn-prev">上一步</button>' : '<div></div>'}
          <button class="btn btn-primary" id="o-btn-next">${step < stepCount - 1 ? '下一步' : '完成'}</button>
        </div>
      `;

      Modal.open('完善患者信息', html, null, { showClose: false, maskClose: false });

      // 动态添加行按钮
      if (step === 1) {
        document.getElementById('btn-add-disease')?.addEventListener('click', () => {
          const list = document.getElementById('disease-list');
          const row = document.createElement('div');
          row.className = 'disease-row';
          row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center;';
          row.innerHTML = `
            <input type="text" class="d-name" placeholder="病名（如：高血压）" style="flex:2;" />
            <input type="number" class="d-years" placeholder="患病年限" min="0" style="flex:1;" />
            <span style="font-size:12px;color:var(--text-tertiary);white-space:nowrap;">年</span>
          `;
          list.appendChild(row);
        });
      }
      if (step === 2) {
        document.getElementById('btn-add-medhist')?.addEventListener('click', () => {
          const list = document.getElementById('medhist-list');
          const row = document.createElement('div');
          row.className = 'medhist-row';
          row.style.cssText = 'margin-bottom:12px;padding:10px;background:var(--bg);border-radius:8px;';
          row.innerHTML = `
            <input type="text" class="mh-name" placeholder="药名" style="width:100%;margin-bottom:6px;" />
            <input type="text" class="mh-dosage" placeholder="剂量/用法（如：1片 tid）" style="width:100%;margin-bottom:6px;" />
            <input type="text" class="mh-reason" placeholder="服用原因" style="width:100%;" />
          `;
          list.appendChild(row);
        });
      }
      if (step === 3) {
        document.getElementById('btn-add-allergy')?.addEventListener('click', () => {
          const list = document.getElementById('allergy-list');
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;';
          row.innerHTML = `<input type="text" class="allergy-item" placeholder="过敏物质" style="flex:1;" />`;
          list.appendChild(row);
        });
      }

      // 上一步
      document.getElementById('o-btn-prev')?.addEventListener('click', () => {
        _onboardStep = step - 1;
        showOnboardStep(_onboardStep);
      });

      // 下一步/完成
      document.getElementById('o-btn-next').addEventListener('click', async () => {
        const stepData = collectOnboardStepData(step);
        // 合并到已保存数据
        const merged = { ...(Storage.getPatient() || {}), ...stepData };
        Storage.savePatient(merged);

        if (step < stepCount - 1) {
          _onboardStep = step + 1;
          showOnboardStep(_onboardStep);
        } else {
          // 完成：注册 + 登录
          try {
            toast('正在注册…');
            const registerData = {
              phone: merged.phone,
              password: '12345',
              name: merged.name,
              sex: merged.sex,
              age: merged.age,
              diseases: merged.diseases || [],
              allergies: merged.allergies || [],
              height: merged.height || '',
              weight: merged.weight || '',
              edu: merged.edu || ''
            };
            await apiFetch('/api/patient/register', {
              method: 'POST',
              body: JSON.stringify(registerData)
            });
            // 注册成功后再登录
            const loginData = await apiFetch('/api/patient/login', {
              method: 'POST',
              body: JSON.stringify({ phone: merged.phone, password: '12345' })
            });
            localStorage.setItem('pma_token', loginData.token);
            localStorage.setItem('pma_patient_id', loginData.patient_id);
            // 注册成功后更新详细信息
            await apiFetch('/api/patient/profile', {
              method: 'PUT',
              body: JSON.stringify({
                sex: merged.sex, age: merged.age,
                height_cm: merged.height ? parseFloat(merged.height) : null,
                weight_kg: merged.weight ? parseFloat(merged.weight) : null,
                edu_level: merged.edu,
                diseases: merged.diseases || [],
                allergies: merged.allergies || []
              })
            });
            Modal.close();
            toast('✓ 注册成功，已自动登录');
            Router.render();
          } catch (err) {
            // 注册失败（可能已注册过），尝试直接登录
            try {
              const loginData = await apiFetch('/api/patient/login', {
                method: 'POST',
                body: JSON.stringify({ phone: merged.phone, password: '12345' })
              });
              localStorage.setItem('pma_token', loginData.token);
              localStorage.setItem('pma_patient_id', loginData.patient_id);
              Modal.close();
              toast('✓ 登录成功');
              Router.render();
            } catch (e2) {
              toast('注册/登录失败，请检查网络');
            }
          }
        }
      });
    }

    function renderChat(root) {

    /** 渲染药师消息列表（会话列表） */
    async function renderChatList(root) {
      const patient = Storage.getPatient();
      const patientName = patient ? (patient.name || '我的') : '我的';
      const patientId = patient ? (patient.id || 'p001') : 'p001';

      // 停止之前的轮询
      if (_msgPollTimer) { clearInterval(_msgPollTimer); _msgPollTimer = null; }

      // 尝试从 API 获取消息
      try {
        const msgs = await apiFetch('/api/messages');
        if (msgs && msgs.conversations) {
          Storage.saveMessages(msgs);
        } else if (Array.isArray(msgs)) {
          // 兼容：如果是数组格式
          Storage.saveMessages({ conversations: msgs });
        }
      } catch (e) {
        console.warn('获取消息列表失败，使用本地缓存', e);
      }

      // 确保有一条默认对话
      const conv = Storage.getOrCreateConversation(patientId, patientName);
      const data = Storage.getMessages();

      // 计算未读总数
      const totalUnread = data.conversations.reduce((s, c) => s + (c.unread || 0), 0);

      let html = `
        <div class="page" style="padding:0;">
          <div style="padding:12px 16px;background:var(--primary);color:#fff;">
            <div style="font-size:14px;opacity:0.9;">${esc(PHARMACIST.hospital)}</div>
            <div style="font-size:16px;font-weight:600;margin-top:4px;">💬 联系药师</div>
            <div style="font-size:12px;opacity:0.85;margin-top:6px;">
              药师：${esc(PHARMACIST.name)} · ${esc(PHARMACIST.dept)}
            </div>
          </div>
          ${totalUnread > 0 ? `<div class="pharmacist-reply-hint">📬 您有 ${totalUnread} 条未读回复</div>` : ''}
          <ul class="chat-list">
      `;

      data.conversations.forEach(c => {
        const timeLabel = formatRelativeTime(c.lastTime);
        const hasUnread = (c.unread || 0) > 0;
        html += `
          <li class="chat-list-item" data-conv-id="${esc(c.id)}">
            <div class="chat-avatar ${hasUnread ? 'has-unread' : ''}">💊</div>
            <div class="chat-info">
              <div class="chat-info-top">
                <span class="chat-name">${esc(c.patientName)}</span>
                <span class="chat-time">${esc(timeLabel)}</span>
              </div>
              <div class="chat-preview">${esc(c.lastMessage || '')}</div>
            </div>
            ${hasUnread ? '<div class="unread-dot"></div>' : ''}
          </li>
        `;
      });

      html += '</ul></div>';

      root.innerHTML = html;

      // 点击进入对话
      root.querySelectorAll('.chat-list-item').forEach(item => {
        item.addEventListener('click', () => {
          location.hash = '#/chat/' + item.dataset.convId;
        });
      });

      // 10 秒轮询新消息
      _msgPollTimer = setInterval(async () => {
        try {
          const msgs = await apiFetch('/api/messages');
          if (msgs && msgs.conversations) {
            Storage.saveMessages(msgs);
            // 重新渲染列表（如果还在聊天列表页）
            if (location.hash === '#/chat' || location.hash.startsWith('#/chat')) {
              renderChatList(document.getElementById('page-root'));
            }
          }
        } catch (e) {
          // 轮询失败不提示，避免刷屏
        }
      }, 10000);
    }

      if (_msgPollTimer) { clearInterval(_msgPollTimer); _msgPollTimer = null; }

          <div class="chat-input-bar">
            <button class="chat-camera-btn" id="chat-camera" title="拍照">📷</button>
            <input type="file" id="chat-photo-input" accept="image/*" capture="environment" style="display:none;" />
            <input type="text" class="chat-input" id="chat-input" placeholder="输入问题…" />
            <button class="chat-mic-btn" id="chat-mic" title="语音">🎤</button>
            <button class="chat-send-btn" id="chat-send" disabled>➤</button>
          </div>
          <!-- 录音提示 -->
          <div class="recording-hint" id="recording-hint">
            <span class="dot"></span>录音中… <span id="recording-time">0:00</span>
          </div>
        </div>
      `;

      root.innerHTML = html;

      // 返回按钮
      document.getElementById('chat-back').addEventListener('click', () => {
        location.hash = '#/chat';
      });

      // 发送按钮状态
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send');
      input.addEventListener('input', () => {
        sendBtn.disabled = !input.value.trim();
      });

      // 发送消息
      sendBtn.addEventListener('click', () => doSendMessage(convId, input, sendBtn));

      // 回车发送
      input.addEventListener('keypress', e => {
        if (e.key === 'Enter' && input.value.trim()) {
          doSendMessage(convId, input, sendBtn);
        }
      });

      // 拍照
      document.getElementById('chat-camera').addEventListener('click', () => {
        document.getElementById('chat-photo-input').click();
      });

      document.getElementById('chat-photo-input').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const base64 = ev.target.result;
          doSendMessage(convId, input, sendBtn, base64);
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      // ---- 语音录制 ----
      let mediaRecorder = null;
      let audioChunks = [];
      let recordingTimer = null;
      let recordingSeconds = 0;
      const MAX_RECORDING_SECONDS = 60;

      const micBtn = document.getElementById('chat-mic');
      const hint = document.getElementById('recording-hint');
      const recTime = document.getElementById('recording-time');

      function formatDur(s) {
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      }

      function startRecording() {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          audioChunks = [];
          recordingSeconds = 0;
          const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm');
          mediaRecorder = new MediaRecorder(stream, { mimeType });
          mediaRecorder.ondataavailable = ev => { if (ev.data.size > 0) audioChunks.push(ev.data); };
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            const blob = new Blob(audioChunks, { type: mimeType });
            const reader = new FileReader();
            reader.onload = ev2 => {
              const base64 = ev2.target.result;
              doSendMessage(convId, input, sendBtn, null, base64, recordingSeconds);
              micBtn.classList.remove('recording');
              hint.classList.remove('show');
              clearInterval(recordingTimer);
              recTime.textContent = '0:00';
            };
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();
          micBtn.classList.add('recording');
          hint.classList.add('show');
          recTime.textContent = formatDur(recordingSeconds);
          recordingTimer = setInterval(() => {
            recordingSeconds++;
            recTime.textContent = formatDur(recordingSeconds);
            if (recordingSeconds >= MAX_RECORDING_SECONDS) {
              clearInterval(recordingTimer);
              if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            }
          }, 1000);
        }).catch(() => {
          toast('请允许麦克风权限');
        });
      }

      micBtn.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          clearInterval(recordingTimer);
          if (mediaRecorder) mediaRecorder.stop();
        } else {
          startRecording();
        }
      });

      // 语音消息点击播放
      root.querySelectorAll('.msg-audio').forEach(btn => {
        btn.addEventListener('click', () => {
          const src = btn.dataset.src;
          if (!src) return;
          if (src.startsWith('mock-audio:')) {
            toast('模拟语音，无法播放');
            return;
          }
          if (btn.classList.contains('playing')) {
            btn._audio && btn._audio.pause();
            btn.classList.remove('playing');
            return;
          }
          document.querySelectorAll('.msg-audio.playing').forEach(b => { b.classList.remove('playing'); b._audio && b._audio.pause(); });
          const audio = new Audio(src);
          btn._audio = audio;
          audio.onended = () => btn.classList.remove('playing');
          audio.onerror = () => { btn.classList.remove('playing'); toast('播放失败'); };
          audio.play();
          btn.classList.add('playing');
        });
      });

      // 图片点击放大
      root.querySelectorAll('.msg-photo').forEach(img => {
        img.addEventListener('click', () => {
          Modal.open('图片预览', `<img src="${img.src}" style="max-width:100%;border-radius:8px;" />`, null, { showClose: true });
        });
      });

      // 滚动到底部
      const msgsEl = document.getElementById('chat-msgs');
      msgsEl.scrollTop = msgsEl.scrollHeight;

      // 10 秒轮询药师回复
      _msgPollTimer = setInterval(async () => {
        try {
          const msgs = await apiFetch('/api/messages');
          if (msgs && msgs.conversations) {
            Storage.saveMessages(msgs);
            const updatedConv = msgs.conversations.find(c => c.id === convId);
            if (updatedConv && updatedConv.messages.length > conv.messages.length) {
              const newMsgs = updatedConv.messages.slice(conv.messages.length);
              newMsgs.forEach(m => {
                msgsEl.innerHTML += buildMessageBubble(m);
              });
              msgsEl.scrollTop = msgsEl.scrollHeight;
            }
          }
        } catch (e) {
          // 轮询失败静默
        }
      }, 10000);
    }

    /** 发送消息核心逻辑 */
    function doSendMessage(convId, input, sendBtn, photoBase64 = null, audioBase64 = null, audioDuration = null) {
      const hasContent = (input && (input.value || '').trim());
      const content = (photoBase64 ? '[图片] ' : '') + (hasContent ? (input.value || '').trim() : '');
      // 语音消息单独一条，content 为 null
      if (!content && !photoBase64 && !audioBase64) return;

      // 调用 API 发送消息（不等待，避免阻塞 UI）
      apiFetch('/api/messages', {
        method: 'POST',
        body: JSON.stringify({
          conversation_id: convId,
          content: audioBase64 ? null : (hasContent ? (input.value || '').trim() : null),
          photo_base64: photoBase64,
          audio_base64: audioBase64,
          audio_duration: audioDuration || 0
        })
      }).catch(() => {
        // 网络失败时仍保留本地消息
      });

      Storage.addPatientMessage(convId, audioBase64 ? null : content, photoBase64, audioBase64, audioDuration);
      if (input) input.value = '';
      if (sendBtn) sendBtn.disabled = true;

      // 重新渲染消息列表
      const msgsEl = document.getElementById('chat-msgs');
      if (msgsEl) {
        const data = Storage.getMessages();
        const conv = data.conversations.find(c => c.id === convId);
        if (conv) {
          msgsEl.innerHTML = conv.messages.map(m => buildMessageBubble(m)).join('');
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }
      }
      // 注意：不再有模拟药师回复，药师真实回复通过轮询获取
    }

    /** 构建单条消息气泡 HTML */
    function buildMessageBubble(msg) {
      const isPatient = msg.from === 'patient';
      const rowClass = isPatient ? 'patient' : 'pharmacist';
      const avatar = isPatient ? '👤' : '💊';
      const photoHtml = msg.photo
        ? `<img class="msg-photo" src="${msg.photo}" alt="图片" />`
        : '';
      const audioHtml = msg.audio
        ? `<button class="msg-audio" data-src="${msg.audio}" title="点击播放"><span class="audio-icon">🎤</span><span class="audio-dur">${msg.duration != null ? (Math.floor(msg.duration / 60) + ':' + String(Math.floor(msg.duration % 60)).padStart(2, '0')) : '0:00'}</span></button>`
        : '';
      return `
        <div class="msg-row ${rowClass}">
          <div class="msg-avatar">${avatar}</div>
          <div>
            ${msg.audio ? audioHtml : `<div class="msg-bubble">${esc(msg.content || '')}</div>`}
            ${photoHtml}
            <div class="msg-time">${esc(msg.time || '')}</div>
          </div>
        </div>
      `;
    }

    /**
     * 将 ISO 时间字符串转为"刚刚"/"N分钟前"/"今天 HH:mm"
     */
    function formatRelativeTime(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        const now = new Date();
        const diffMs = now - d;
        const diffMin = Math.floor(diffMs / 60000);
        if (diffMin < 1) return '刚刚';
        if (diffMin < 60) return diffMin + '分钟前';
        // 同一天显示时间
        if (d.toDateString() === now.toDateString()) {
          return d.toTimeString().slice(0, 5);
        }
        // 昨天
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) {
          return '昨天 ' + d.toTimeString().slice(0, 5);
        }
        return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' + d.toTimeString().slice(0, 5);
      } catch (e) {
        return isoStr;
      }
    }

    /* ----------------------------------------------------------
     * 12b. 患者登录页
     * ---------------------------------------------------------- */
    function renderLoginPage(root) {
      // 隐藏 tab-bar 和 page-header
      document.getElementById('tab-bar').style.display = 'none';
      document.getElementById('page-header').style.display = 'none';
      document.getElementById('app').style.paddingTop = '0';
      document.getElementById('app').style.paddingBottom = '0';

      root.innerHTML = `
        <div class="login-page">
          <div class="login-card-box">
            <div class="login-logo">💊</div>
            <div class="login-title">患者用药管理</div>
            <div class="login-subtitle">青岛市市立医院 · 临床药学科</div>
            <div class="login-field">
              <label>手机号</label>
              <input type="tel" id="login-phone" placeholder="请输入手机号" maxlength="11" autocomplete="off" />
            </div>
            <div class="login-field">
              <label>密码</label>
              <input type="password" id="login-password" placeholder="请输入密码" />
            </div>
            <button class="login-btn" id="btn-patient-login">登 录</button>
            <div class="login-error" id="login-error"></div>
            <div class="login-hint">
              <strong>📌 测试账号</strong><br>
              手机号：13800001111<br>
              密码：12345<br><br>
              <strong>首次使用</strong>点击下方注册，填写基本信息即可创建账号
            </div>
            <a href="javascript:void(0)" class="login-link-pharmacist" id="link-register">还没有账号？点此注册 →</a>
            <a href="pharmacist-login.html" class="login-link-pharmacist">药师登录 →</a>
          </div>
        </div>
      `;

      const phoneInput = document.getElementById('login-phone');
      const pwdInput = document.getElementById('login-password');
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-patient-login');

      async function doLogin() {
        const phone = phoneInput.value.trim();
        const pwd = pwdInput.value;
        errEl.textContent = '';
        if (!phone) { errEl.textContent = '请输入手机号'; phoneInput.focus(); return; }
        if (!pwd) { errEl.textContent = '请输入密码'; pwdInput.focus(); return; }

        btn.disabled = true;
        btn.textContent = '登录中…';

        try {
          const data = await apiFetch('/api/patient/login', {
            method: 'POST',
            body: JSON.stringify({ phone, password: pwd })
          });
          localStorage.setItem('pma_token', data.token);
          localStorage.setItem('pma_patient_id', data.patient_id || data.patient?.id);
          document.getElementById('tab-bar').style.display = '';
          document.getElementById('page-header').style.display = '';
          document.getElementById('app').style.paddingTop = '';
          document.getElementById('app').style.paddingBottom = '';
          toast('✓ 登录成功');
          if (data.patient) Storage.savePatient(data.patient);
          Router.render();
        } catch (err) {
          errEl.textContent = err.message || '登录失败';
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      }

      btn.addEventListener('click', doLogin);
      pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

      document.getElementById('link-register').addEventListener('click', () => {
        document.getElementById('tab-bar').style.display = '';
        document.getElementById('page-header').style.display = '';
        document.getElementById('app').style.paddingTop = '';
        document.getElementById('app').style.paddingBottom = '';
        _onboardStep = 0;
        showOnboardStep(0);
      });
    }

    /* ----------------------------------------------------------
     * 13. PWA 注册（Service Worker）
     * ---------------------------------------------------------- */
    function registerSW() {
      if ('serviceWorker' in navigator) {
        // 仅在生产环境（HTTPS 或 localhost）注册
        if (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
              .then(reg => console.log('[SW] 注册成功:', reg.scope))
              .catch(err => console.warn('[SW] 注册失败:', err));
          });
        } else {
          console.info('[SW] 非 HTTPS/localhost 环境，跳过注册');
        }
      }
    }

    /* ----------------------------------------------------------
     * 13. 启动
     * ---------------------------------------------------------- */
    async function bootstrap() {
      // 路由初始化
      Router.init();
      // 注册 Service Worker
      registerSW();
      // 启动提醒循环
      startReminderLoop();

      // Token 验证：检查本地是否有 token，有则验证有效性
      const token = localStorage.getItem('pma_token');
      if (token) {
        try {
          const profile = await apiFetch('/api/patient/profile');
          Storage.savePatient(profile);
          try {
            const meds = await apiFetch('/api/medications');
            Storage.saveMedications(meds || []);
          } catch (e) { /* 药品加载失败不影响主流程 */ }
        } catch (e) {
          // Token 无效，清除并显示登录页
          localStorage.removeItem('pma_token');
          localStorage.removeItem('pma_patient_id');
        }
      }

      // 检查是否已登录：有 token 且有 patient 信息 -> 正常进 App
      // 没有 token -> 显示登录页
      const hasToken = localStorage.getItem('pma_token');
      const patient = Storage.getPatient();

      if (!hasToken || !patient) {
        // 显示登录页
        document.getElementById('tab-bar').style.display = 'none';
        document.getElementById('page-header').style.display = 'none';
        document.getElementById('app').style.paddingTop = '0';
        document.getElementById('app').style.paddingBottom = '0';
        renderLoginPage(document.getElementById('page-root'));
      } else {
        // 已登录，正常启动
        checkPatientOnboarding();
      }
    }

    // DOM 就绪后启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
