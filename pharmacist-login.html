<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2B7AEE">
  <title>药师登录 · 青岛市市立医院</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --primary: #2B7AEE;
      --primary-dark: #1B5BB5;
      --primary-light: #E8F1FF;
      --primary-glow: rgba(43,122,238,0.25);
      --accent: #5B8DEF;
      --warning: #FF6B6B;
      --bg-soft: #E8ECF4;
      --card-bg: #FFFFFF;
      --text-primary: #1A1D29;
      --text-secondary: #555B6E;
      --text-tertiary: #8C92A5;
      --border: #E4E8F0;
      --radius: 12px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   "Helvetica Neue", sans-serif;
      background: linear-gradient(160deg, #2B7AEE 0%, #1B5BB5 50%, #5B8DEF 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 背景装饰 */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      pointer-events: none;
    }
    .bg-circle.c1 { top: -80px; right: -80px; width: 240px; height: 240px; }
    .bg-circle.c2 { bottom: -100px; left: -60px; width: 200px; height: 200px; }
    .bg-circle.c3 { top: 40%; right: -40px; width: 100px; height: 100px; background: rgba(255,255,255,0.04); }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-xl);
      padding: 40px 32px 32px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.12);
      position: relative;
      z-index: 1;
      animation: cardIn 0.6s var(--ease-out);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-box {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 28px var(--primary-glow);
    }

    .hospital-name {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .dept-name {
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
      margin-bottom: 32px;
    }

    .form-field { margin-bottom: 16px; }
    .form-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-field input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      background: var(--bg-soft);
      outline: none;
      transition: all 0.2s var(--ease-out);
    }
    .form-field input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-field input.error {
      border-color: var(--warning);
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .btn-primary {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 20px var(--primary-glow);
      transition: all 0.3s var(--spring);
      letter-spacing: 0.5px;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      color: var(--warning);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      text-align: center;
      font-weight: 500;
    }

    .demo-hint {
      margin-top: 24px;
      padding: 14px 16px;
      background: var(--primary-light);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--primary-dark);
      line-height: 1.7;
      text-align: left;
    }
    .demo-hint strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>

  <div class="login-card">
    <div class="logo-box">🏥</div>
    <div class="hospital-name">青岛市市立医院</div>
    <div class="dept-name">临床药学科 · 用药管理平台</div>

    <div class="form-field">
      <label>药师账号</label>
      <input type="text" id="username" placeholder="请输入账号" autocomplete="off" />
    </div>
    <div class="form-field">
      <label>登录密码</label>
      <input type="password" id="password" placeholder="请输入密码" />
    </div>

    <button class="btn-primary" id="btn-login">登 录</button>
    <div class="error-msg" id="error-msg"></div>

    <a href="index.html" class="back-link">← 返回患者端</a>

    <div class="demo-hint">
      <strong>📌 演示账号</strong>
      账号：pharmacist<br>
      密码：qdsl1234<br><br>
      <strong>⚠️ 正式使用</strong>
      需联系管理员开通专属账号
    </div>
  </div>

  <script>
    const btnLogin = document.getElementById('btn-login');
    const inputUsername = document.getElementById('username');
    const inputPassword = document.getElementById('password');
    const errorMsg = document.getElementById('error-msg');

    async function doLogin() {
      const u = inputUsername.value.trim();
      const p = inputPassword.value;

      errorMsg.textContent = '';
      inputUsername.classList.remove('error');
      inputPassword.classList.remove('error');

      if (!u) {
        errorMsg.textContent = '请输入账号';
        inputUsername.classList.add('error');
        return;
      }
      if (!p) {
        errorMsg.textContent = '请输入密码';
        inputPassword.classList.add('error');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = '登录中…';

      try {
        const res = await fetch('/api/pharmacist/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const json = await res.json();

        if (!res.ok) {
          errorMsg.textContent = json.detail || json.message || '账号或密码错误';
          inputPassword.classList.add('error');
          btnLogin.disabled = false;
          btnLogin.textContent = '登 录';
          return;
        }

        const pharm = json.data.pharmacist;
        sessionStorage.setItem('pharm_token', json.data.token);
        sessionStorage.setItem('pharmacist_session', JSON.stringify({
          username: u,
          name: pharm.name,
          dept: pharm.dept,
          hospital: pharm.hospital,
          loginTime: new Date().toISOString()
        }));

        location.href = 'pharmacist.html';
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查网络后重试';
        btnLogin.disabled = false;
        btnLogin.textContent = '登 录';
      }
    }

    btnLogin.addEventListener('click', doLogin);
    inputPassword.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
