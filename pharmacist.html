<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>药师管理后台 · 青岛市市立医院</title>
  <style>
    /* ============================================================
     * 变量定义
     * ============================================================ */
    :root {
      --primary: #2B7AEE;
      --primary-dark: #1B5BB5;
      --primary-light: #E8F1FF;
      --primary-glow: rgba(43,122,238,0.25);
      --accent: #5B8DEF;
      --success: #34C759;
      --success-light: #E8F9EC;
      --warning: #FF6B6B;
      --warning-light: #FFF1F0;
      --bg: #F2F5FA;
      --bg-soft: #E8ECF4;
      --card-bg: #FFFFFF;
      --text-primary: #1A1D29;
      --text-secondary: #555B6E;
      --text-tertiary: #8C92A5;
      --text-disabled: #BFC4D2;
      --border: #E4E8F0;
      --divider: #EFF2F8;
      --shadow: 0 2px 12px rgba(20,30,60,0.06);
      --shadow-md: 0 4px 20px rgba(20,30,60,0.08);
      --shadow-lg: 0 8px 32px rgba(20,30,60,0.12);
      --shadow-glow: 0 4px 24px var(--primary-glow);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --tab-height: 60px;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: var(--tab-height); /* 底部Tab空间 */
    }

    /* ============================================================
     * 顶部导航栏
     * ============================================================ */
    .header {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: var(--text-primary);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .header-info { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
    .logout-btn {
      background: var(--primary-light);
      border: none;
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
    }
    .logout-btn:active { transform: scale(0.95); }

    /* ============================================================
     * 统计卡片栏
     * ============================================================ */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      text-align: center;
      padding: 18px 8px;
      background: var(--bg-soft);
      border-radius: var(--radius-lg);
      transition: transform 0.3s var(--spring);
    }
    .stat-item:active { transform: scale(0.96); }
    .stat-icon {
      font-size: 22px;
      margin-bottom: 6px;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
    }
    .stat-num.warn { color: var(--warning); }
    .stat-num.ok { color: var(--success); }
    .stat-label { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; }

    /* ============================================================
     * 内容区域（搜索栏）
     * ============================================================ */
    .search-bar {
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
    }
    .search-input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 20px;
      padding: 8px 14px;
      gap: 8px;
    }
    .search-input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      outline: none;
    }
    .filter-chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .filter-chip {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 16px;
      white-space: nowrap;
      cursor: pointer;
      background: var(--bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .filter-chip.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* ============================================================
     * 页面内容
     * ============================================================ */
    .page-content { padding: 14px 16px; }

    /* ============================================================
     * 患者卡片
     * ============================================================ */
    .patient-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(20,30,60,0.05);
      cursor: pointer;
      transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
      border: 1px solid rgba(228,232,240,0.6);
    }
    .patient-card:active { transform: scale(0.985); }
    .patient-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .patient-name { font-size: 16px; font-weight: 600; }
    .patient-gender { font-size: 12px; color: var(--text-tertiary); margin-left: 8px; }
    .patient-age { font-size: 13px; color: var(--text-secondary); }

    /* 依从性进度条 */
    .adherence-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .bar-track {
      flex: 1;
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .bar-fill.low { background: var(--warning); }
    .adherence-text { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; }
    .adherence-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--success);
      margin-left: 12px;
      flex-shrink: 0;
    }
    .adherence-num.low { color: var(--warning); }

    /* 标签 */
    .patient-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { font-size: 11px; padding: 3px 10px; border-radius: 12px; }
    .tag-disease { background: var(--primary-light); color: var(--primary); }
    .tag-allergy { background: var(--warning-light); color: var(--warning); border-radius: 999px; }
    .patient-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    /* ============================================================
     * 患者详情页
     * ============================================================ */
    .detail-page { display: none; }
    .detail-page.active { display: block; }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--primary);
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 14px;
    }
    .detail-section {
      background: white;
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 12px;
    }
    .info-item label { font-size: 12px; color: var(--text-tertiary); display: block; margin-bottom: 4px; }
    .info-item span { font-size: 15px; color: var(--text-primary); font-weight: 600; }

    /* 病史列表 */
    .disease-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .disease-item:last-child { border-bottom: none; }
    .disease-years { font-size: 13px; color: var(--text-tertiary); }

    /* 用药列表 */
    .med-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .med-list-item:last-child { border-bottom: none; }
    .med-name { font-size: 14px; font-weight: 500; }
    .med-info { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
    .check-ok { color: var(--success); font-size: 20px; }
    .check-no { color: var(--text-tertiary); font-size: 20px; }

    /* 操作按钮 */
    .action-btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      border: none;
      transition: box-shadow 0.2s, opacity 0.2s;
    }
    .action-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(24,144,255,0.3);
    }
    .action-primary:active { opacity: 0.85; }
    .action-secondary {
      background: var(--bg);
      color: var(--text-secondary);
      box-shadow: var(--shadow);
    }
    .action-secondary:active { opacity: 0.8; }

    /* ============================================================
     * 不良反应上报卡片
     * ============================================================ */
    .report-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--warning);
    }
    .report-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
    .report-patient { font-size: 16px; font-weight: 600; }
    .report-time { font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }
    .severity-badge {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: 600;
    }
    .sev-light { background: #FFF7E6; color: #FA8C16; }
    .sev-mid { background: var(--warning-light); color: var(--warning); }
    .sev-sev { background: var(--warning); color: white; }
    .report-symptoms { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .symptom-tag {
      font-size: 12px;
      background: var(--bg);
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: 12px;
    }
    .report-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.6;
    }
    .report-actions { display: flex; gap: 10px; margin-top: 14px; }

    /* ============================================================
     * 模态框（底部弹出）
     * ============================================================ */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(10,15,30,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-mask.show { display: flex; }
    .modal-sheet {
      background: white;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
    }
    .modal-sheet::before {
      content: '';
      display: block;
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      margin: 0 auto 16px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title { font-size: 17px; font-weight: 600; }
    .modal-close { font-size: 22px; color: var(--text-tertiary); background: none; border: none; cursor: pointer; }
    .guide-form textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
      outline: none;
    }
    .guide-form textarea:focus { border-color: var(--primary); }

    /* ============================================================
     * 底部 Tab 导航
     * ============================================================ */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--tab-height);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 99;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      position: relative;
      transition: color 0.3s var(--ease-out), transform 0.3s var(--spring);
      padding: 6px 0;
      border-radius: 8px;
      margin: 0 2px;
    }
    .tab-item.active {
      color: var(--primary);
      transform: translateY(-2px);
    }
    .tab-item.active::before {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary-glow);
    }
    .tab-icon { font-size: 20px; line-height: 1; }
    .tab-text { font-size: 11px; font-weight: 500; }
    .tab-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 18px);
      background: var(--warning);
      color: white;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      min-width: 16px;
      text-align: center;
    }

    /* ============================================================
     * Toast 提示
     * ============================================================ */
    #toast {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px) scale(0.9);
      background: rgba(15,18,30,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.35s var(--spring);
      z-index: 300;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

    /* ============================================================
     * 空状态提示
     * ============================================================ */
    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-tertiary);
      font-size: 14px;
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }

    /* ============================================================
     * 患者消息（聊天）模块
     * ============================================================ */
    /* 聊天列表页 */
    .chat-page { display: none; }
    .chat-page.active { display: block; }
    .chat-list-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 12px;
      transition: background 0.15s;
    }
    .chat-list-item:active { background: var(--bg); }
    .chat-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      flex-shrink: 0;
      position: relative;
    }
    .chat-avatar .unread-dot {
      position: absolute; top: 0; right: 0;
      width: 14px; height: 14px;
      background: var(--warning);
      border-radius: 50%;
      border: 2px solid white;
      font-size: 9px; color: white;
      display: flex; align-items: center; justify-content: center;
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .chat-preview { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-meta { text-align: right; flex-shrink: 0; }
    .chat-time { font-size: 11px; color: var(--text-tertiary); }

    /* 聊天对话页 */
    .conv-page { display: none; flex-direction: column; height: calc(100vh - var(--tab-height) - 57px); }
    .conv-page.active { display: flex; }
    .conv-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .conv-back { font-size: 22px; color: var(--primary); cursor: pointer; padding: 4px; }
    .conv-title { font-size: 16px; font-weight: 600; flex: 1; }
    .conv-phone { font-size: 12px; color: var(--text-tertiary); }
    .conv-body {
      flex: 1; overflow-y: auto;
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 12px;
      background: var(--bg);
    }
    .msg-row { display: flex; flex-direction: column; max-width: 75%; }
    .msg-row.patient { align-self: flex-start; }
    .msg-row.pharmacist { align-self: flex-end; align-items: flex-end; }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-all;
    }
    .msg-row.patient .msg-bubble {
      background: white;
      color: var(--text-primary);
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
    }
    .msg-row.pharmacist .msg-bubble {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 12px var(--primary-glow);
    }
    .msg-time { font-size: 10px; color: var(--text-tertiary); margin-top: 4px; }
    .msg-img {
      max-width: 200px; max-height: 200px;
      border-radius: 8px; cursor: pointer;
      object-fit: cover;
    }
    .msg-img:active { opacity: 0.85; }
    .msg-audio {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      min-width: 80px; max-width: 200px;
      cursor: pointer;
      background: var(--bg);
      border: none;
      font-size: 14px;
      font-family: inherit;
      text-align: left;
    }
    .msg-audio:hover { filter: brightness(0.95); }
    .msg-audio.playing { background: var(--primary-light); }
    .msg-audio .audio-icon { font-size: 20px; flex-shrink: 0; }
    .msg-audio .audio-dur { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .msg-audio.playing .audio-dur { color: var(--primary); }
    .msg-row.pharmacist .msg-audio { background: #e6f7ff; }
    .msg-row.pharmacist .msg-audio:hover { background: #d9f0ff; }
    .msg-row.pharmacist .msg-audio.playing { background: #bae0ff; }
    .msg-row.pharmacist .msg-audio .audio-dur { color: var(--primary-dark); }
    /* 底部输入栏 */
    .conv-input-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: white;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .conv-input-bar input {
      flex: 1;
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .conv-input-bar input:focus { border-color: var(--primary); }
    .conv-icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--bg);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .conv-icon-btn:active { background: var(--border); }
    .conv-mic-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--bg);
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .conv-mic-btn:active { background: var(--border); }
    .conv-mic-btn.recording {
      background: #ff4d4f;
      color: #fff;
      animation: mic-pulse 1s infinite;
    }
    @keyframes mic-pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .recording-hint {
      position: fixed;
      bottom: calc(var(--tab-height) + 70px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(38,38,38,0.85);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 200;
      display: none;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .recording-hint.show { display: flex; }
    .recording-hint .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4d4f;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

/**
 * 通用 Fetch 封装，自动携带 Token，处理 401
 */
async function apiFetch(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const token = sessionStorage.getItem('pharm_token');
  if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    const res = await fetch(API_BASE + path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
    const json = await res.json();
    if (!res.ok) {
      if (res.status === 401) {
        sessionStorage.removeItem('pharm_token');
        sessionStorage.removeItem('pharmacist_info');
        toast('登录已过期，请重新登录');
        setTimeout(() => { location.href = 'pharmacist-login.html'; }, 1500);
      }
      throw new Error(json.detail || json.message || '请求失败');
    }
    return json.data !== undefined ? json.data : json;
  } catch (err) {
    if (err.message !== '请求失败') {
      toast('网络异常：' + err.message);
    }
    throw err;
  }
}

/* ============================================================
 * 患者列表渲染
 * ============================================================ */
function renderPatientList(filter = 'all', keyword = '') {
  const listEl = document.getElementById('patient-list');

  // 有关键词时从 API 搜索，无关键词时用本地数据
  if (keyword) {
    apiFetch(`/api/pharmacist/patients?keyword=${encodeURIComponent(keyword)}`).then(data => {
      if (Array.isArray(data)) {
        patients = data;
      }
      applyFilterAndRender(filter, keyword);
    }).catch(() => {
      // API 失败，用本地数据过滤
      applyFilterAndRender(filter, keyword);
    });
  } else {
    applyFilterAndRender(filter, keyword);
  }
}

function applyFilterAndRender(filter, keyword) {
  const listEl = document.getElementById('patient-list');
  let filtered = patients;

  // 依从性筛选
  if (filter === 'low') filtered = filtered.filter(p => (p.adherence || 0) < 0.7);
  if (filter === 'high') filtered = filtered.filter(p => (p.adherence || 0) >= 0.85);

  // 关键词搜索（本地）
  if (keyword) {
    const kw = keyword.toLowerCase();
    filtered = filtered.filter(p =>
      (p.name || '').toLowerCase().includes(kw) || (p.phone || '').includes(kw)
    );
  }

  // 空状态
  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        未找到匹配的患者
      </div>`;
    return;
  }

  // 渲染卡片列表
  listEl.innerHTML = filtered.map(p => {
    const pct = Math.round(p.adherence * 100);
    const barClass = pct < 70 ? 'low' : '';
    const adherenceLabel = pct >= 85 ? '依从性好' : pct < 70 ? '依从性低' : '依从性中等';
    const diseaseTags = (p.diseases || []).slice(0, 2).map(d =>
      `<span class="tag tag-disease">${d.name}</span>`
    ).join('');
    const allergyTags = (p.allergies || []).slice(0, 1).map(a =>
      `<span class="tag tag-allergy">过敏:${a}</span>`
    ).join('');

    return `
      <div class="patient-card" data-id="${p.id}">
        <div class="patient-header">
          <div>
            <span class="patient-name">${p.name}</span>
            <span class="patient-gender">${p.sex}</span>
          </div>
          <div class="patient-age">${p.age}岁</div>
        </div>
        <div class="adherence-bar">
          <div class="bar-track">
            <div class="bar-fill ${barClass}" style="width:${pct}%"></div>
          </div>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;">
          <span class="adherence-num ${barClass ? 'low' : ''}">${pct}%</span>
          <span class="adherence-text">${adherenceLabel}</span>
        </div>
        <div class="patient-tags">
          ${diseaseTags}${allergyTags}
        </div>
        <div class="patient-meta">
          <span>📞 ${p.phone}</span>
          <span>最近: ${p.lastVisit}</span>
        </div>
      </div>
    `;
  }).join('');

  // 绑定点击事件（事件委托）
  listEl.querySelectorAll('.patient-card').forEach(card => {
    card.addEventListener('click', () => showPatientDetail(card.dataset.id));
  });
}

/* ============================================================
 * 患者详情
 * ============================================================ */
function showPatientDetail(id) {
  currentPatientId = id;

  // 优先从 API 加载，失败则用本地数据
  apiFetch(`/api/pharmacist/patients/${id}`).then(p => {
    if (p && p.id) {
      // 更新本地缓存中的患者数据
      const idx = patients.findIndex(x => x.id === id);
      if (idx >= 0) patients[idx] = p;
      renderPatientDetailHTML(p);
    }
  }).catch(() => {
    // API 失败，用本地数据
    const p = patients.find(x => x.id === id);
    if (p) renderPatientDetailHTML(p);
  });
}

function renderPatientDetailHTML(p) {
  if (!p || !p.id) return;

  // 显示详情页
  document.getElementById('patient-detail').style.display = '';
  document.getElementById('patient-detail').classList.add('active');
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('search-bar').style.display = 'none';
  document.getElementById('header-title').textContent = (p.name || '患者') + ' 的档案';

  // 计算BMI
  const h = parseFloat(p.height) / 100;
  const bmi = h > 0 ? (p.weight / (h * h)).toFixed(1) : '--';

  // 依从性颜色

 * 不良反应工作台
 * ============================================================ */
async function renderReports() {
  const listEl = document.getElementById('report-list');

  // 尝试从 API 加载
  try {
    const data = await apiFetch('/api/pharmacist/adverse-reports');
    if (Array.isArray(data)) {
      reports = data;
    }
  } catch (e) {
    console.warn('获取不良反应列表失败，使用本地 Mock 数据', e);
  }

  if (reports.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✅</div>
        暂无不良反应上报记录
      </div>`;
    return;
  }

  listEl.innerHTML = reports.map(r => {
    const sevClass = r.severity === '轻度' ? 'sev-light' :
                     r.severity === '中度' ? 'sev-mid' : 'sev-sev';
    return `
      <div class="report-card" data-id="${r.id}">
        <div class="report-header">
          <span class="report-patient">👤 ${r.patientName}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="severity-badge ${sevClass}">${r.severity}</span>
            <span class="report-time">${r.date}</span>
          </div>
        </div>
        <div class="report-symptoms">
          ${r.symptoms.map(s => `<span class="symptom-tag">${s}</span>`).join('')}
        </div>
        <div class="report-desc">${r.description}</div>
        <div style="font-size:12px;color:var(--text-tertiary);margin-top:8px;">患者ID: ${r.patientId} · 编号: ${r.id}</div>
        <div class="report-actions">
          <button class="action-btn action-secondary" data-patient="${r.patientId}">查看档案</button>
          <button class="action-btn action-primary" data-report="${r.id}">${r.status === '待处理' ? '处理' : '已处理'}</button>
        </div>
      </div>
    `;
  }).join('');

  // 绑定卡片内按钮事件
  listEl.querySelectorAll('.action-secondary').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      showPatientDetail(btn.dataset.patient);
    });
  });
  listEl.querySelectorAll('.action-primary').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      handleReport(btn.dataset.report);
    });
  });
}

function handleReport(id) {
  const r = reports.find(x => x.id === id);
  if (!r) return;
  if (r.status === '待处理') {
    // 调用 API 标记为已处理
    apiFetch(`/api/pharmacist/adverse-reports/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ status: '已回复' })
    }).then(() => {
      r.status = '已回复';
      toast('已标记为已处理');
      renderReports();
      updateStats();
    }).catch(() => {
      // API 失败时仍更新本地状态
      r.status = '已回复';
      toast('已标记为已处理（离线模式）');
      renderReports();
      updateStats();
    });
  } else {
    toast('该报告已完成处理');
  }
}

const MSG_STORE_KEY = 'pma_messages';

/**
 * 从 localStorage 加载消息数据，若无数据则写入 Mock 模拟对话
 * @returns {Object} 包含 conversations 数组的消息对象
 */
function loadMessages() {
  let data = null;
  try {
    const raw = localStorage.getItem(MSG_STORE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) {}
  if (!data || !Array.isArray(data.conversations)) {
    // 无数据时写入一条 Mock 模拟对话
    const mockData = {
      conversations: [
        {
          id: 'conv_mock_001',
          patientName: '张华',
          patientId: 'p001',
          phone: '138****1234',
          lastMessage: '药师你好，我吃了药有点恶心，正常吗？',
          lastTime: '今天 10:28',
          unread: 1,
          messages: [
            { id: 'm_mock_1', from: 'patient', content: '药师你好，我吃了药有点恶心，正常吗？', time: '10:28', photo: null }
          ]
        }
      ]
    };
    localStorage.setItem(MSG_STORE_KEY, JSON.stringify(mockData));
    return mockData;
  }
  return data;
}

/**
 * 保存消息数据到 localStorage
 * @param {Object} data 消息对象
 */
function saveMessages(data) {
  localStorage.setItem(MSG_STORE_KEY, JSON.stringify(data));
}

/**
 * 渲染消息列表页（聊天列表）
 */
function renderChatList() {
  const listEl = document.getElementById('chat-list');
  const data = loadMessages();
  const convs = data.conversations || [];

  if (convs.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        暂无患者消息
      </div>`;
    return;
  }

  // 按时间倒序
  const sorted = [...convs].sort((a, b) => {
    return new Date(b.lastTime) - new Date(a.lastTime);
  });

  listEl.innerHTML = sorted.map(c => {
    const initial = c.patientName ? c.patientName[0] : '?';
    const dot = c.unread > 0
      ? `<div class="unread-dot">${c.unread > 9 ? '9+' : c.unread}</div>`
      : '';
    return `
      <div class="chat-list-item" data-id="${c.id}">
        <div class="chat-avatar">${initial}${dot}</div>
        <div class="chat-info">
          <div class="chat-name">${c.patientName}</div>
          <div class="chat-preview">${c.lastMessage || ''}</div>
        </div>
        <div class="chat-meta">
          <div class="chat-time">${c.lastTime || ''}</div>
        </div>
      </div>`;
  }).join('');

  // 绑定点击：进入对话详情
  listEl.querySelectorAll('.chat-list-item').forEach(item => {
    item.addEventListener('click', () => openConversation(item.dataset.id));
  });

  // 更新消息 Tab 未读徽章
  const totalUnread = convs.reduce((s, c) => s + (c.unread || 0), 0);
  const badge = document.getElementById('tab-chat-badge');
  if (totalUnread > 0) {
    badge.textContent = totalUnread > 99 ? '99+' : totalUnread;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

/**
 * 打开指定对话详情页
 * @param {string} convId 对话 ID
 */
function openConversation(convId) {
  const data = loadMessages();
  const conv = (data.conversations || []).find(c => c.id === convId);
  if (!conv) return;

  currentConvId = convId;

  // 清零未读数
  conv.unread = 0;
  saveMessages(data);
  // 重新渲染徽章
  const totalUnread = (data.conversations || []).reduce((s, c) => s + (c.unread || 0), 0);
  const badge = document.getElementById('tab-chat-badge');
  if (totalUnread > 0) {
    badge.textContent = totalUnread > 99 ? '99+' : totalUnread;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  // 填充头部信息
  document.getElementById('conv-title').textContent = conv.patientName || '患者';
  document.getElementById('conv-phone').textContent = conv.phone || '';

  // 渲染消息气泡
  renderMessages(conv.messages || []);

  // 隐藏其他页面，显示对话页
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('page-chat').style.display = 'none';
  document.getElementById('search-bar').style.display = 'none';
  document.getElementById('patient-detail').style.display = 'none';
  document.getElementById('page-conv').style.display = 'flex';
  document.getElementById('page-conv').classList.add('active');
  document.getElementById('header-title').textContent = '💬 患者消息';
}

/**
 * 渲染单条消息气泡到对话页面
 * @param {Array} messages 消息数组
 */
function renderMessages(messages) {
  const body = document.getElementById('conv-body');
  body.innerHTML = '';

  messages.forEach(msg => {
    const isPatient = msg.from === 'patient';
    const row = document.createElement('div');
    row.className = `msg-row ${isPatient ? 'patient' : 'pharmacist'}`;

    const timeStr = msg.time || '';

    if (msg.audio) {
      const durStr = msg.duration != null ? (Math.floor(msg.duration / 60) + ':' + String(Math.floor(msg.duration % 60)).padStart(2, '0')) : '0:00';
      row.innerHTML = `
        <button class="msg-audio" data-src="${msg.audio}" title="点击播放"><span class="audio-icon">🎤</span><span class="audio-dur">${durStr}</span></button>
        <div class="msg-time">${timeStr}</div>`;
      row.querySelector('.msg-audio').addEventListener('click', function() {
        const btn = this;
        const src = btn.dataset.src;
        if (!src) return;
        if (src.startsWith('mock-audio:')) { toast('模拟语音，无法播放'); return; }
        if (btn.classList.contains('playing')) {
          btn._audio && btn._audio.pause();
          btn.classList.remove('playing');
          return;
        }
        document.querySelectorAll('.msg-audio.playing').forEach(b => { b.classList.remove('playing'); b._audio && b._audio.pause(); });
        const a = new Audio(src);
        btn._audio = a;
        a.onended = () => btn.classList.remove('playing');
        a.onerror = () => { btn.classList.remove('playing'); toast('播放失败'); };
        a.play();
        btn.classList.add('playing');
      });
    } else if (msg.photo) {
      row.innerHTML = `
        <div class="msg-bubble" style="padding:6px;"><img class="msg-img" src="${msg.photo}" alt="图片" /></div>
        <div class="msg-time">${timeStr}</div>`;
      row.querySelector('.msg-img').addEventListener('click', () => openPhotoPreview(msg.photo));
    } else {
      row.innerHTML = `
        <div class="msg-bubble">${msg.content || ''}</div>
        <div class="msg-time">${timeStr}</div>`;
    }

    body.appendChild(row);
  });

  // 滚动到底部
  body.scrollTop = body.scrollHeight;
}

/**
 * 发送药师回复消息
 * @param {string|null} content 文字内容
 * @param {string|null} photo 照片 data URL 或 null
 * @param {string|null} audio 音频 data URL 或 null
 * @param {number|null} duration 音频时长（秒）或 null
 */
function sendMessage(content, photo, audio, duration) {
  if (!content && !photo && !audio) return;
  const data = loadMessages();
  const conv = (data.conversations || []).find(c => c.id === currentConvId);
  if (!conv) return;

  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const timeStr = `${hh}:${mm}`;

  const msgObj = {
    id: 'm_' + Date.now(),
    from: 'pharmacist',
    content: content || null,
    time: timeStr,
    photo: photo || null,
    audio: audio || null,
    duration: duration != null ? duration : null
  };

  conv.messages = conv.messages || [];
  conv.messages.push(msgObj);
  conv.lastMessage = audio ? '[语音消息]' : (content ? (content.length > 30 ? content.substring(0, 30) + '…' : content) : '[图片]');
  conv.lastTime = '今天 ' + timeStr;
  saveMessages(data);

  // 追加本条消息到 DOM
  const body = document.getElementById('conv-body');
  const row = document.createElement('div');
  row.className = 'msg-row pharmacist';
  if (audio) {
    const durStr = duration != null ? (Math.floor(duration / 60) + ':' + String(Math.floor(duration % 60)).padStart(2, '0')) : '0:00';
    const audioEl = document.createElement('button');
    audioEl.className = 'msg-audio';
    audioEl.dataset.src = audio;
    audioEl.title = '点击播放';
    audioEl.innerHTML = `<span class="audio-icon">🎤</span><span class="audio-dur">${durStr}</span>`;
    audioEl.addEventListener('click', () => {
      if (audioEl.classList.contains('playing')) {
        audioEl._audio && audioEl._audio.pause();
        audioEl.classList.remove('playing');
        return;
      }
      document.querySelectorAll('.msg-audio.playing').forEach(b => { b.classList.remove('playing'); b._audio && b._audio.pause(); });
      const a = new Audio(audio);
      audioEl._audio = a;
      a.onended = () => audioEl.classList.remove('playing');
      a.onerror = () => { audioEl.classList.remove('playing'); toast('播放失败'); };
      a.play();
      audioEl.classList.add('playing');
    });
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.gap = '2px';
    wrap.appendChild(audioEl);
    const timeDiv = document.createElement('div');
    timeDiv.className = 'msg-time';
    timeDiv.textContent = timeStr;
    wrap.appendChild(timeDiv);
    row.appendChild(wrap);
  } else if (photo) {
    row.innerHTML = `<div class="msg-bubble" style="padding:6px;"><img class="msg-img" src="${photo}" alt="图片" /></div><div class="msg-time">${timeStr}</div>`;
    row.querySelector('.msg-img').addEventListener('click', () => openPhotoPreview(photo));
  } else {
    row.innerHTML = `<div class="msg-bubble">${content}</div><div class="msg-time">${timeStr}</div>`;
  }
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;

  // 更新列表页的预览
  conv.lastMessage = audio ? '[语音消息]' : (content || '[图片]');
  conv.lastTime = '今天 ' + timeStr;
}

});

// 患者消息：输入框回车发送
document.getElementById('conv-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('conv-send').click();
  }
});

// 患者消息：拍照按钮（调起 file input）
document.getElementById('conv-camera').addEventListener('click', () => {
  if (!document.getElementById('conv-camera-file')) {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.capture = 'environment';
    fileInput.id = 'conv-camera-file';
    fileInput.style.display = 'none';
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        sendMessage(null, e.target.result, null, null);
        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    });
    document.body.appendChild(fileInput);
  }
  document.getElementById('conv-camera-file').click();
});

// ---- 语音录制（药师端） ----
let mediaRecorder2 = null;
let audioChunks2 = [];
let recordingTimer2 = null;
let recordingSeconds2 = 0;
const MAX_RECORDING_SECONDS = 60;

function formatDur(s) {
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function startRecording2() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    audioChunks2 = [];
    recordingSeconds2 = 0;
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm');
    mediaRecorder2 = new MediaRecorder(stream, { mimeType });
    mediaRecorder2.ondataavailable = ev => { if (ev.data.size > 0) audioChunks2.push(ev.data); };
    mediaRecorder2.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks2, { type: mimeType });
      const reader = new FileReader();
      reader.onload = ev2 => {
        const base64 = ev2.target.result;
        sendMessage(null, null, base64, recordingSeconds2);
        const micBtn = document.getElementById('conv-mic');
        const hint = document.getElementById('recording-hint');
        const recTime = document.getElementById('recording-time');
        if (micBtn) micBtn.classList.remove('recording');
        if (hint) hint.classList.remove('show');
        if (recTime) recTime.textContent = '0:00';
        clearInterval(recordingTimer2);
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder2.start();
    const micBtn = document.getElementById('conv-mic');
    const hint = document.getElementById('recording-hint');
    const recTime = document.getElementById('recording-time');
    if (micBtn) micBtn.classList.add('recording');
    if (hint) hint.classList.add('show');
    if (recTime) recTime.textContent = formatDur(recordingSeconds2);
    recordingTimer2 = setInterval(() => {
      recordingSeconds2++;
      if (recTime) recTime.textContent = formatDur(recordingSeconds2);
      if (recordingSeconds2 >= MAX_RECORDING_SECONDS) {
        clearInterval(recordingTimer2);
        if (mediaRecorder2 && mediaRecorder2.state === 'recording') mediaRecorder2.stop();
      }
    }, 1000);
  }).catch(() => { toast('请允许麦克风权限'); });
}

document.getElementById('conv-mic').addEventListener('click', () => {
  if (mediaRecorder2 && mediaRecorder2.state === 'recording') {
    clearInterval(recordingTimer2);
    if (mediaRecorder2) mediaRecorder2.stop();
  } else {
    startRecording2();
  }
});

// 图片预览模态框：点击关闭
document.getElementById('photo-modal').addEventListener('click', e => {
  if (e.target.id === 'photo-modal' || e.target.closest('.modal-sheet')) {
    closePhotoPreview();
  }
});
